<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
       
        h1
        {
          background-color: rgb(124, 236, 231);
          color: black;
          padding: 20px;
          text-align: center;
        }

        table,th,td
        {
            border: 1px solid black;
            border-collapse: collapse;
            padding: 5px;
        }

    </style>


</head>
<body>

<h1>Agenda salão</h1>

<table>

 <tr>
            <th>Dia da semana</th>
            <th>Manhã</th>
            <th>Tarde</th>
            <th>Noite</th>

        </tr>

         <tr>
            <td>Segunda</td>
            <td>Cliente 1</td>
            <td colspan="2">Cliente 2</td>
            
        </tr>

         <tr>
            <td>Terça</td>
            <td>Cliente 1</td>
            <td>Cliente 2</td>
            <td>Cliente 3</td>
        </tr>

         <tr>
            <td rowspan="2">Quarta</td>
            <td>Cliente 1</td>
            <td rowspan="2">Cliente 3</td>
            <td>Cliente 4</td>
        </tr>

         <tr>
            
            <td>Cliente 2</td>
            
            <td>Cliente 5</td>
        </tr>

         <tr>
            <td>Quinta</td>
            <td colspan="2">Cliente 1</td>
            
            <td>Cliente 2</td>
        </tr>

        <tr>
            <td rowspan="2">Sexta</td>
            <td>Cliente 1</td>
            <td>Cliente 2</td>
            <td rowspan="">Cliente 3</td>
        </tr>

         <tr>
            
            <td>Cliente 1</td>
            <td colspan="2">Cliente 2</td>
            
            
         </tr>


</table>


    
</body>
</html>
